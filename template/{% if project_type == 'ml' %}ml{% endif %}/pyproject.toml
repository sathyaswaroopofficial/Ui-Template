[project]
name = "ml-core"
version = "0.1.0"
description = "Data, features, training, evaluation and inference code"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_core"]
